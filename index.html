/* Hide chrome until the first keybind/main paint — prevents a 1-frame empty menu flash. */
html:not(.static-shark-ready) #cluster{opacity:0!important;visibility:hidden!important;pointer-events:none!important;transition:none!important;}
html,body,.PWrapper{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;font-optical-sizing:auto;}
    :root {
        --menu-color: 22, 137, 212;
        --menu-x: 4.5%;
        --menu-y: 26%;
        --menu-scale: 1;
        --resolution-scale: 1;
        --menu-radius: .35vw;
        --menu-bg: rgba(8, 8, 12, 0.95);
        --menu-border: rgba(255,255,255,0.06);
        --text-primary: rgba(255,255,255,0.92);
        --text-secondary: rgba(255,255,255,0.55);
        --surface: rgba(255,255,255,0.04);
        --surface-hover: rgba(255,255,255,0.07);
        --surface-active: rgba(255,255,255,0.02);
        /* Shared optical centering — matches right-side controls (+.06vw). */
        --row-nudge: .06vw;
        --text-baseline: .01vw;
        --descender-pad: .05vw;
        --text-nudge: var(--text-baseline);
        --ctrl-nudge: var(--row-nudge);
    }

    /* DUI already sizes with vw — do not auto-shrink (DPR * width falsely hits 4K). */

    *, *::before, *::after { box-sizing: border-box; }

    .Desc {
        position: absolute; display: flex; left: 50%; bottom: 4vw;
        transform: translate(-50%); width: auto; height: 1.3vw;
        background: rgba(8,8,12,0.96); border-radius: .26vw;
        padding: 0 1vw; font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 400;
        font-size: .62vw; color: var(--text-secondary);
        justify-content: center; align-items: center;
        border: .06vw solid rgba(var(--menu-color),0.2);
        white-space: nowrap;
    }

    .menu-loading {
        display: flex; justify-content: center; align-items: center;
        width: 100%; min-height: 2.4vw; padding: .8vw 0;
        font-size: .58vw; font-weight: 500; letter-spacing: .04em;
        color: rgba(var(--menu-color), 0.85);
        text-transform: uppercase;
    }

    .PWrapper {
        position: absolute; display: flex;
        width: 19.0104vw;
        left: var(--menu-x); top: var(--menu-y);
        transform: translate(0%,0%) scale(calc(var(--menu-scale) * var(--resolution-scale)));
        transform-origin: top left;
        justify-content: flex-start; align-items: stretch;
        flex-direction: column; font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        filter: drop-shadow(0 .6vw 1.8vw rgba(0,0,0,0.6));
        box-sizing: border-box;
    }

    .PWrapper .PElements {
        position: relative; display: flex;
        width: 100%;
        justify-content: flex-start; align-items: stretch;
        flex-direction: row; gap: 0;
        box-sizing: border-box;
    }

    .PWrapper .PElements .PScroll {
        position: absolute; display: flex;
        left: -.95vw;
        top: 0;

        width: 100%; height: .06vw;
        background: linear-gradient(90deg,
            transparent 0%, rgba(var(--menu-color),0.35) 15%,
            rgba(255,255,255,0.08) 85%, transparent 100%);
    }

    /* Small icon in front of each row key, coloured like the reference. */
    .PWrapper .Metadata .Values .Value .Key i.pi-ic {
        display: inline-block; width: .78vw;
        margin-right: .34vw;
        font-size: .58vw; text-align: center;
        color: rgba(var(--menu-color),0.85);
        transform: translateY(.02vw);
    }

    /* Subtle divider between the grouped sections. */
    .PWrapper .Metadata .Values .piDivider {
        height: .06vw; width: 100%;
        margin: .18vw 0;
        background: linear-gradient(90deg,
            transparent 0%, rgba(255,255,255,0.07) 50%, transparent 100%);
    }
    /* A divider is not a .Value, so kill the top border the adjacency rule would add. */
    .PWrapper .Metadata .Values .piDivider + .Value { border-top: none; }

    .PWrapper .Metadata .Values {
        display: flex; width: 100%;
        flex-direction: column;
        padding-top: .3vw;
    }

    .PWrapper .Metadata .Values .Value {
        position: relative; display: flex; width: 100%;
        justify-content: space-between; align-items: center;
        padding: .24vw .1vw;
        border-radius: calc(var(--menu-radius) * .8);
        transition: background .12s ease;
    }

    .PWrapper .Metadata .Values .Value + .Value {
        border-top: .06vw solid rgba(255,255,255,0.035);
    }

    .PWrapper .Metadata .Values .Value:hover {
        background: rgba(var(--menu-color),0.1);
        border-top-color: transparent;
    }

    .PWrapper .Metadata .Values .Value .Key {
        font-weight: 450; font-size: .56vw;
        letter-spacing: .04vw;
        color: rgba(255,255,255,0.48);
        text-transform: uppercase;
        line-height: 1;
        transform: translateY(var(--text-nudge));
    }

    .PWrapper .Metadata .Values .Value .Val {
        position: static;
        display: flex; align-items: center; gap: .4vw;
    }

    .PWrapper .Metadata .Values .Value .Val span {
        font-weight: 500; font-size: .6vw;
        color: var(--text-primary);
        font-variant-numeric: tabular-nums;
        line-height: 1;
        transform: translateY(var(--text-nudge));
    }

    /* slim vertical health/armour gauge (fill height set inline as value%) */
    .PWrapper .Metadata .Values .Value .Val .Status {
        position: relative;
        width: .3vw; height: .82vw;
        background: rgba(0,0,0,0.55);
        border-radius: .2vw;
        overflow: hidden;
        box-shadow: inset 0 0 0 .06vw rgba(255,255,255,0.06);
    }

    .PWrapper .Metadata .Values .Value .Val .Status .Progress {
        position: absolute; left: 0; right: 0; bottom: 0;
        width: 100%;
        border-radius: .2vw;
        box-shadow: 0 0 .25vw currentColor;
        transition: height .3s cubic-bezier(.22,.8,.3,1);
    }

    .PWrapper .PFooter {
        position: relative; display: flex;
        align-items: center; justify-content: space-between;
        width: 100%; height: 1.3vw;
        margin: .08vw 0 0 0;
        padding: 0 .6vw 0 .45vw;
        background: rgba(0,0,0,0.7);
        border-radius: calc(var(--menu-radius) * .7);
        border: .06vw solid var(--menu-border);
        overflow: hidden;
        box-sizing: border-box;
    }

    .PWrapper .PFooter img {
        position: absolute; left: .45vw;
        width: .9vw; opacity: .9;
    }

    .PWrapper .PFooter .PBuild {
        position: relative; left: auto; top: auto;
        display: flex;
        align-items: center;
        height: 100%;
        font-size: .55vw; font-weight: 450;
        letter-spacing: .04vw;
        line-height: 1;
        color: var(--text-secondary);
        transform: none;
        flex: 0 0 auto;
    }

    .PWrapper .PFooter .PIndicator {
        position: relative; right: auto; top: auto;
        display: flex;
        align-items: center;
        height: 100%;
        font-size: .55vw; font-weight: 400;
        line-height: 1;
        color: var(--text-secondary);
        transform: none;
        flex: 0 0 auto;
        margin-left: auto;
    }



/* Silk toasts — no panel header. Same glass / accent / type as HUD. */
.NotificationsWrapper {
    position: absolute;
    display: none;
    left: 50%;
    right: auto;
    top: auto;
    bottom: 2.52vw;
    transform: translateX(-50%);
    width: auto;
    min-width: 11.2vw;
    max-width: 22vw;
    flex-direction: column;
    align-items: center;
    gap: 0;
    padding: 0;
    background: none;
    border: none;
    border-radius: 0;

}
.NotificationsWrapper .Header { display: none !important; }
.NotificationsWrapper .Notifications {
    display: flex;
    width: 100%;

    align-items: stretch;

}

.Notification {

    display: flex;
    flex-direction: row;
    align-items: center;
    width: 100%;
    min-width: 0;
    min-height: 1.28vw;
    max-height: 3.2vw;

}

.Notification::before {
    content: none;

}

.Notification.success { --n-accent: rgb(var(--menu-color)); }
.Notification.info { --n-accent: rgb(var(--menu-color)); }
.Notification.error { --n-accent: #ef6b6b; }
.Notification.off { --n-accent: #8b93a3; }

.Notification.enter {
    opacity: 1;
    transform: translate3d(0, 0, 0);
}
.Notification.exit {
    opacity: 0;
    transform: translate3d(0, .22vw, 0);
}

.NotificationInner,
.NotificationContent {
    display: flex;
    flex: 1 1 auto;
    min-width: 0;
    width: auto;
    align-items: center;
    justify-content: space-between;
    gap: .4vw;
    padding: 0;
    margin: 0;
    background: none;
    border: none;
}

.NotificationMark,
.NotificationMark svg,
.NotificationMark::after,
.NotificationKind {

}

.NotificationTitle {

    font-weight: 500;
    letter-spacing: .01vw;

    color: var(--text-primary);
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.Notification.info .NotificationTitle,
.Notification.success .NotificationTitle,
.Notification.error .NotificationTitle,
.Notification.off .NotificationTitle {
    color: var(--text-primary);
}

.NotificationBody {
    display: flex;
    align-items: center;
    flex: 0 0 auto;
    max-width: none;

    padding: 0;

    font-weight: 600;

    color: var(--n-accent);
    line-height: 1;

}

.Notification.off .NotificationBody { color: var(--text-secondary); }
.Notification.error .NotificationBody { color: #ef6b6b; }
.Notification.solo .NotificationBody { display: none; }

.NotificationProgress {
    display: block;
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: .04vw;
    background: transparent;

}
.NotificationProgress i {
    display: block;

}
@keyframes notifyBarShrink {
    from { transform: scaleX(1); }
    to { transform: scaleX(0); }
}


.Overlay {
    position: absolute; display: flex;
    width: 100%; height: 100%;
    background: radial-gradient(120% 120% at 50% 45%, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.72) 100%);
    animation: OverlayFade .18s ease both;
}

@keyframes OverlayFade { from { opacity: 0; } to { opacity: 1; } }

.InputWrapper {
    position: absolute; display: flex;
    left: 50%; bottom: 8vw;

    flex-direction: column;
    background:
        linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 22%),

    font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
    border-radius: calc(var(--menu-radius) * 1.6);

        0 .6vw 2vw rgba(0,0,0,0.6),
        0 0 0 .06vw rgba(0,0,0,0.4),

/* top accent line, fading outward */
.InputWrapper::before {

@keyframes InputPop {

.InputWrapper .Header {

}

.InputWrapper .Header img {

}

.InputWrapper .Header .Line {
    width: .05vw; height: .75vw;

}

.InputWrapper .Header i { margin-left: .3vw; }

.InputWrapper .Body {
    display: flex; width: 100%;

    padding: .6vw;
    font-size: .6vw; color: var(--text-primary);
}

.InputWrapper .Body .InsideCon {
    position: relative; display: flex;

}

.InputWrapper .Body .InsideCon span {
    font-weight: 500; font-size: .62vw;

.InputWrapper .Body .InsideCon span::after {
    content: ""; display: inline-block;
    width: .08vw; height: .7vw;
    vertical-align: middle;
    background: rgb(var(--menu-color));
    box-shadow: 0 0 .3vw rgba(var(--menu-color),0.7);
    margin-left: .15vw;

}

@keyframes blink { to { visibility: hidden; } }

/* Shared Eshay HUD list chrome (blue via --menu-color) */
.KBLWrapper, .SBLWrapper {
    position: absolute; display: none;
    width: var(--hud-panel-w);
    flex-direction: column;
    font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
    font-optical-sizing: auto;
    border-radius: var(--menu-radius);

    z-index: 8;
}
.SBLWrapper {
    left: var(--hud-dock-left);
    top: var(--hud-dock-top);
    right: auto;
}
.KBLWrapper {
    right: var(--hud-dock-left);
    top: var(--hud-dock-top);
    left: auto;
}
/* Keybinds always dock top-right (solo = no spectators panel) */

}
.KBLWrapper.show, .SBLWrapper.show { display: flex !important; }

.KBLWrapper .Header, .SBLWrapper .Header {
    display: flex; width: 100%; height: 1.35vw;

    gap: .3vw;
    padding: 0 .55vw;

}
.KBLWrapper .Header .Icon, .SBLWrapper .Header .Icon {
    display: inline-flex; align-items: center; justify-content: center;

}
.KBLWrapper .Header .Icon svg, .SBLWrapper .Header .Icon svg {

}
.KBLWrapper .Header .Icon { font-size: .55vw; }
.KBLWrapper .Header span, .SBLWrapper .Header span {
    font-size: .52vw; font-weight: 600;

    align-items: center;
}

.KBLWrapper .Keybinds, .SBLWrapper .Spectators {

}

.KBLWrapper .Keybinds .Keybind,
.SBLWrapper .Spectators .Spectator {
    display: flex; width: 100%; min-height: .9vw;
    justify-content: space-between; align-items: center;
    gap: .35vw;
    padding: .18vw 0;
    position: relative;
}

.KBLWrapper .Keybinds .Keybind .Label,
.SBLWrapper .Spectators .Spectator .Label {
    position: static;
    display: flex;
    align-items: center;
    font-size: .52vw; font-weight: 450;
    color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0; flex: 1;
    line-height: 1;
}

.KBLWrapper .Keybinds .Keybind .Elements,
.SBLWrapper .Spectators .Spectator .Elements {
    position: static;

    flex: 0 0 auto;
}

.KBLWrapper .Keybinds .Keybind .Elements .Key,
.SBLWrapper .Spectators .Spectator .Elements .Key {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: .82vw; height: .75vw;
    padding: 0 .22vw;

    line-height: 1;
    color: var(--text-primary);
    background: rgba(255,255,255,0.06);
    border: .06vw solid var(--menu-border);
    border-bottom-width: .12vw;
    border-radius: .13vw;
    box-sizing: border-box;
}

.KBLWrapper .Keybinds .Keybind .Elements .State {
    font-size: .48vw; font-weight: 600;

}
.KBLWrapper .Keybinds .Keybind .Elements .State.On { color: rgb(var(--menu-color)); }
.KBLWrapper .Keybinds .Keybind .Elements .State.Off { color: var(--text-secondary); }

.SBLWrapper .Spectators .Spectator .Elements .State {
    font-size: .48vw; font-weight: 600;
    letter-spacing: .02vw;
    min-width: .9vw; text-align: right;
    color: var(--text-secondary);
    white-space: nowrap;
    line-height: 1;
    display: flex;
    align-items: center;
}

.KBLWrapper .empty, .SBLWrapper .empty {
    padding: .45vw 0; font-size: .5vw; font-weight: 400;
    color: var(--text-secondary); text-align: center;
    line-height: 1.2;
    display: flex; align-items: center; justify-content: center;
}

.PWrapper{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease,visibility 0s linear .18s;}

/* INDEX_POS_LOCK */
.PWrapper:not(.keybind-mode){left:var(--menu-x)!important;top:var(--menu-y)!important;width:19.0104vw!important;transform:translate(0%,0%) scale(calc(var(--menu-scale)*var(--resolution-scale)))!important;transform-origin:top left!important;align-items:stretch!important;}

.PWrapper.fast-nav #list{transition:transform .12s cubic-bezier(.22,1,.36,1)!important;}.PWrapper.fast-nav #selOverlay{transition:top .12s cubic-bezier(.22,1,.36,1),height .12s cubic-bezier(.22,1,.36,1)!important;}.PWrapper.fast-nav #psProgress{transition:none!important;}
/* Full rebuilds (tab switches) must not animate in from the old scroll offset. */
.PWrapper.rendering #list{transition:none!important;}.PWrapper.rendering #selOverlay{transition:none!important;}.PWrapper.rendering #psProgress{transition:none!important;}

<body>
<div class="Desc" id="descBox"><span id="descText"></span></div>
<div class="PWrapper" id="cluster">
  <div class="PBanner" id="banner">
    <img id="bannerImg" src="__BANNER_URL__" alt="" draggable="false" referrerpolicy="no-referrer" decoding="async"/>
    <div class="CustomBanner theme-cyber" id="bannerFallback" style="display:none" aria-hidden="true">
      <div class="ESHAYText">STATIC</div>
    </div>
  </div>
  <div class="PElements">
    <div class="PScroll" id="pScroll">
      <i class="fa-solid fa-angle-up" id="scrollUp"></i>
      <div class="PSProgressWrapper"><div class="PSProgress" id="psProgress"></div></div>
      <i class="fa-solid fa-angle-down" id="scrollDown"></i>
    </div>
    <div class="PRightElements">
      <div class="PCategories" id="tabsbar"></div>
      <div class="PTabs" id="listWrap">
        <div id="selOverlay" style="position:absolute;left:.11vw;right:auto;width:calc(100% - .22vw);height:1.6vw;border-radius:.3083vw;pointer-events:none;z-index:0;opacity:0;box-sizing:border-box;margin:0;transform:none;transition:top 200ms ease, height 120ms ease;"></div>
        <div class="keybind-panel" id="keybindPanel">
          <div class="kb-head">
            <div class="kb-icon" id="kbCaptureIcon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2.15"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round"/></svg>
            </div>
            <span class="kb-head-title" id="kbTitle">Menu Keybind</span>
          </div>
          <div class="kb-body">
            <div class="keybind-hint" id="kbHint">Press any key, then Enter to confirm</div>
            <div class="keybind-input" id="kbInput">...</div>
            <div class="kb-actions">
              <div class="kb-chip"><span class="kb-k">ENTER</span><span class="kb-d">Confirm</span></div>
              <div class="kb-chip"><span class="kb-k">BACKSPACE</span><span class="kb-d">Cancel</span></div>
            </div>
          </div>
        </div>
        <div id="list"></div>
      </div>
      <div class="PFooter">
        <span class="PBuild" id="footL">Static Menu</span>
        <span class="PIndicator" id="footR">(1/1)</span>
      </div>
    </div>
  </div>
  <div class="Metadata" id="piDisplay">
    <div class="Title"><span id="piName">Player</span><span id="piSid" class="piSid"></span></div>
    <div class="Line"></div>
    <div class="Values" id="piList"></div>
  </div>
</div>

<div class="SBLWrapper" id="spDisplay">
  <div class="Header">
    <div class="Icon" id="spDisplayIcon"></div>
    <span>Spectators</span>
  </div>
  <div class="Spectators" id="spDisplayList"></div>
</div>
<div class="KBLWrapper" id="kbDisplay">
  <div class="Header">
    <div class="Icon" id="kbDisplayIcon"></div>
    <span>Keybinds</span>
  </div>
  <div class="Keybinds" id="kbDisplayList"></div>
</div>
<div class="NotificationsWrapper" id="notifyWrap">
  <div class="Notifications" id="notifyList"></div>
</div>
<div class="ac-display" id="acDisplay">
  <div class="ac-display-panel">
    <div class="ac-display-head"><div class="ac-display-icon" id="acDisplayIcon"></div><span>Detected on</span></div>
    <div class="ac-display-list" id="acDisplayList"></div>
  </div>
</div>

<div class="color-picker" id="colorPicker">
  <div class="color-picker-panel">
    <div class="color-picker-title" id="colorPickerTitle">Color</div>
    <div class="color-picker-divider"></div>
    <div class="color-picker-body">
      <div class="color-square" id="colorSquare"><div class="color-dot" id="colorDot"></div></div>
      <div class="hue-bar" id="hueBar"><div class="hue-dot" id="hueDot"></div></div>
    </div>
    <div class="color-picker-footer">
      <div class="color-swatch" id="colorSwatch"></div>
      <div class="color-hex" id="colorHex">#1689d4</div>
    </div>
  </div>
</div>

<div class="gun-picker" id="gunPicker">
  <div class="gun-picker-shell">
    <div class="gun-picker-rail" id="gunPickerRail"></div>
    <div class="gun-picker-menu">
      <div class="gun-picker-head">
        <div class="gun-picker-head-icon" id="gunPickerIcon"></div>
        <span id="gunPickerTitle">Guns</span>
      </div>

        <div class="gun-picker-list" id="gunPickerGrid"></div>

      <div class="gun-picker-footer">
        <span class="gun-picker-hint" id="gunPickerHint">Up / Down = move | Enter = give | Backspace = close</span>
        <span class="gun-picker-count" id="gunPickerCount">1/14</span>
      </div>
    </div>
  </div>
</div>

<div class="vw-root" id="vwRoot">
  <div class="vw-dim"></div>
  <div class="vw-wheel" id="vwWheel">
    <svg class="vw-svg" id="vwSvg" viewBox="0 0 620 620"></svg>
    <div class="vw-hub"><div>
      <div class="vw-hub-cat" id="vwCat"></div>
      <div class="vw-hub-w" id="vwWeapon"></div>
      <div class="vw-hub-i" id="vwIndex"></div>
    </div></div>
  </div>
</div>
<div class="inp-overlay" id="inp">
  <div class="inp-panel" id="inpPanel">
    <div class="inp-header">
      <div class="inp-header-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </div>
      <span class="inp-header-title" id="inpHeader">Input</span>
    </div>
    <div class="inp-body">
      <div class="inp-notice" id="inpNotice"></div>
      <div class="inp-value-row">
        <div class="inp-field">
          <input type="text" class="inp-value" id="inpValue" autocomplete="off" spellcheck="false" readonly tabindex="-1" placeholder="Type here..."/>
        </div>
        <div class="inp-paste-btn" id="inpPasteBtn" hidden></div>
      </div>
      <div class="inp-hint" id="inpHint"></div>
      <div class="inp-actions" id="inpActions" hidden></div>
    </div>
  </div>
</div>
<script>
(function(){
  try{ document.documentElement.style.setProperty('--resolution-scale', '1'); }catch(_){}

  function unwrapStaticDuiMessage(raw){
    let d=raw;
    if(typeof d==='string'){ try{d=JSON.parse(d);}catch(_){return null;} }
    if(!d) return null;
    if(d.t==='ui'){
      if(typeof d.text==='string'&&(d.text.charAt(0)==='{'||d.text.charAt(0)==='[')){
        try{
          const body=JSON.parse(d.text);
          if(body&&typeof body==='object'){
            for(const k in body){ if(d[k]==null) d[k]=body[k]; }
          }
        }catch(_){}
      }
      return d;
    }
    if(d.type==='ui'&&d.text!=null){
      try{
        const inner=typeof d.text==='string'?JSON.parse(d.text):d.text;
        if(inner&&inner.t==='ui') return inner;
        if(inner&&inner.open!=null&&(inner.rows||inner.mode))
          return { t:'ui', action:'render', payload: inner };
      }catch(_){}
    }
    if(d.type&&d.text!=null){
      const typ=String(d.type);
      let body=d.text;
      if(typeof body==='string'&&(body.charAt(0)==='{'||body.charAt(0)==='[')){
        try{ body=JSON.parse(body); }catch(_){ body=null; }
      }
      if(typ==='render'){
        let payload=d.text;
        if(typeof payload==='string'){ try{ payload=JSON.parse(payload); }catch(_){} }
        return { t:'ui', action:'render', payload };
      }
      if(body&&typeof body==='object'&&body.open!=null&&(body.rows||body.mode))
        return { t:'ui', action:'render', payload: body };
      if(body&&typeof body==='object') return Object.assign({ t:'ui', action:typ }, body);
      return { t:'ui', action:typ, text:d.text };
    }
    return null;
  }

  function applyInjectCss(css, opts){
    if(!css) return;
    opts=opts||{};
    const cssId=String(opts.cssId||'staticInjectCss');
    const replace=opts.replace===true;
    if(cssId==='staticSharkMenuFix'){
      const legacy=document.getElementById('staticInjectCss');
      if(legacy) legacy.remove();
    }
    let el=document.getElementById(cssId);
    if(!el){
      el=document.createElement('style');
      el.id=cssId;
      document.head.appendChild(el);
    }
    if(replace) el.textContent=css;
    else el.textContent=(el.textContent||'')+css;
  }
  window.__staticInjectCssBuf=null;
  window.__staticInjectCssTarget='staticInjectCss';
  window.__staticInjectCssReplace=false;

  const cluster=document.getElementById('cluster');
  const list=document.getElementById('list');
  const listWrap=document.getElementById('listWrap');
  const tabsbar=document.getElementById('tabsbar');
  const footR=document.getElementById('footR');
  const footL=document.getElementById('footL');
  const bannerImg=document.getElementById('bannerImg');
  const bannerFallback=document.getElementById('bannerFallback');
  function showBannerFallback(show){
    if(bannerFallback) bannerFallback.style.display = show ? 'flex' : 'none';
    if(bannerImg) bannerImg.style.display = show ? 'none' : 'block';
  }
  function bindBannerImg(img){
    if(!img) return;
    img.addEventListener('load', function(){ showBannerFallback(false); });
    img.addEventListener('error', function(){ showBannerFallback(true); });
    if(img.complete){
      if(img.naturalWidth > 0) showBannerFallback(false);
      else showBannerFallback(true);
    }
  }
  bindBannerImg(bannerImg);
  const selOverlay=document.getElementById('selOverlay');
  const psProgress=document.getElementById('psProgress');
  const descBox=document.getElementById('descBox');
  const descText=document.getElementById('descText');
  const keybindPanel=document.getElementById('keybindPanel');
  const kbTitle=document.getElementById('kbTitle');
  const kbHint=document.getElementById('kbHint');
  const kbInput=document.getElementById('kbInput');
  const listSectionHeader=document.getElementById('listSectionHeader');
  const listSectionHeaderLabel=document.getElementById('listSectionHeaderLabel');
  const inp=document.getElementById('inp');
  const inpPanel=document.getElementById('inpPanel');
  const inpHeader=document.getElementById('inpHeader');
  const inpValue=document.getElementById('inpValue');
  const inpHint=document.getElementById('inpHint');
  const inpNotice=document.getElementById('inpNotice');
  const inpPasteBtn=document.getElementById('inpPasteBtn');
  const inpActions=document.getElementById('inpActions');

  function resolveInputValue(d){
    if(d==null) return '';
    if(d.value!=null) return d.value;
    if(typeof d.text==='string'){
      if(d.text.charAt(0)==='{'||d.text.charAt(0)==='['){
        try{
          const p=JSON.parse(d.text);
          if(p&&p.value!=null) return p.value;
        }catch(_){}
      }
      return d.text;
    }
    return '';
  }

  function setInpNotice(txt){
    if(inpNotice) inpNotice.textContent=txt||'';
  }

  const ROW_H_VW = 1.6;
  const MAX_H_VW = 14.0625; // Eshay default panel cap (inside)
  const DEFAULT_VIS = Math.max(1, Math.floor(MAX_H_VW / ROW_H_VW)); // 8
  const INSIDE_VISIBLE_ROWS = 10;
  const MIN_VISIBLE_ROWS = 8;
  const BANNER_H = null; // measured
  const THEME_RGB = {green:'19, 95, 27',blue:'22, 137, 212',savage:'254, 242, 5',baxci:'87, 191, 242',aus:'240, 130, 28',winter:'232, 241, 249',muzz:'217, 150, 103',jamaica:'224, 158, 17'};
  function maxVisibleRows(showTabs, isMain){
    const rh = Math.max(18, window.innerWidth * (ROW_H_VW/100));
    const banner = (document.getElementById('banner') && document.getElementById('banner').offsetHeight) || (window.innerWidth * 0.065);
    const cats = showTabs ? (window.innerWidth * 0.016) : (window.innerWidth * 0.016);
    const foot = window.innerWidth * 0.013;
    const top = cluster ? cluster.getBoundingClientRect().top : (window.innerHeight * 0.26);
    const avail = Math.max(rh * MIN_VISIBLE_ROWS, window.innerHeight - top - banner - cats - foot - 16);
    const bySpace = Math.max(MIN_VISIBLE_ROWS, Math.floor(avail / rh));
    if(isMain) return bySpace;
    return Math.min(INSIDE_VISIBLE_ROWS, bySpace);
  }
  window.__staticMaxVisibleRows = maxVisibleRows;

  window.__staticMenuPaste='';
  window.__staticLastState=null;
  let _lastSelAt=0;

  function menuColor(){
    return getComputedStyle(document.documentElement).getPropertyValue('--menu-color').trim() || '22, 137, 212';
  }
  function esc(s){ return String(s==null?'':s); }

  function applyTheme(theme, bannerUrl){
    if(theme){
      document.documentElement.setAttribute('data-theme', theme);
      // A custom Menu Color (set from Lua) wins over the theme's colour and persists across every
      // render (staticRender calls applyTheme each state update, which used to stomp the custom colour).
      const rgb = window.__customMenuColor || THEME_RGB[theme] || THEME_RGB.blue;
      document.documentElement.style.setProperty('--menu-color', rgb);
    }
    if(bannerUrl && bannerImg){
      showBannerFallback(false);
      if(bannerImg.src === bannerUrl){
        // Force reload when CDN previously failed.
        bannerImg.src = '';
      }
      bannerImg.src = bannerUrl;
    }
  }
  window.applyBannerTheme = function(url, theme){ applyTheme(theme||'blue', url); };

function S(inner){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">'+inner+'</svg>';

    return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+inner+'</svg>';
  }

    'eye-off':S('<path d="M4 12s3.2-5.4 8-5.4c1.15 0 2.2.25 3.15.7M20 12s-1.2 2.1-3.1 3.7M3 3l18 18"/><path d="M9.2 9.4 14.7 14.9"/>'),
    car:S('<path d="M4 15.2h16"/><path d="M5.2 15.2 6.6 10h10.8l1.4 5.2"/><path d="M8.2 10V8.1h7.6V10"/><rect x="5.4" y="15.2" width="3.1" height="3.1"/><rect x="15.5" y="15.2" width="3.1" height="3.1"/>'),
    bike:S('<circle cx="6.4" cy="16.2" r="3"/><circle cx="17.6" cy="16.2" r="3"/><path d="M6.4 16.2h5.1l2.1-4.6h3.4M12.2 9.2l2.2-2.4h3"/>'),

    skull:S('<path d="M8.2 8.2c0-2.3 1.7-4.1 3.8-4.1s3.8 1.8 3.8 4.1v2.1H8.2z"/><path d="M8.2 12.4h7.6v2.8H8.2z"/><path d="M10 15.2v2.4M14 15.2v2.4"/><rect x="9.1" y="9.4" width="1.5" height="1.5"/><rect x="13.4" y="9.4" width="1.5" height="1.5"/>'),

    engine:S('<path d="M4.6 10.2h2.1V8.2h2.1V6.4h6.4v1.8h2.1v2h2.1v4.2h-2.1v1.8h-2.1v1.8H8.8v-1.8H6.7v-1.8H4.6z"/><rect x="9.6" y="10.2" width="4.8" height="3.6"/>'),
    'stop-circle':S('<circle cx="12" cy="12" r="8.2"/><rect x="8.4" y="8.4" width="7.2" height="7.2"/>'),

  function buildRow(r, i, activeIdx){

      div.innerHTML='<div class="Left"></div><span class="Label"></span><div class="Right"></div>';
      div.querySelector('.Label').textContent=esc(r.label||'');
      tab.appendChild(div);
      tab.addEventListener('mousedown', function(ev){
        ev.preventDefault();
        if(window.__staticColorPickerActive || window.__staticGunPickerActive) return;

    if(r.gender==='Male' || r.gender==='Female' || r.dead){

      if(r.gender==='Male' || r.gender==='Female'){

  function rowHeightPx(){

  function rowPitchPx(){

      if(d > 0.5) return d;

    if(list && list.children.length && list.children[0].offsetHeight){

  function readListShiftPx(){
    if(list && list.style.transform){

      if(m) return Math.max(0, parseFloat(m[1]) || 0);

    const color = row.classList.contains('red-row') ? '229, 72, 72' : menuColor();
    // offsetTop + recorded shift — getBoundingClientRect reads mid-transform and jumps.
    const rowH = (list.children[0] && list.children[0].offsetHeight) || row.offsetHeight || 0;
    const scrollPx = readListShiftPx() || Math.max(0, (scrollOffset||0) * rowH);
    let topPx = Math.max(0, (row.offsetTop||0) - scrollPx);
    let hPx = row.offsetHeight || rowH || 1;

    // corners clear of that clip so the overlay's own .3083vw radius renders fully and
    // identically on both sides.

  function isCountedRow(r){

  function selectablePos(rows, activeIdx){
    let total=0, pos=0, last=0;
    for(let i=0;i<rows.length;i++){
      if(!isCountedRow(rows[i])) continue;
      total++;
      if(i===activeIdx) pos=total;
      else if(i<activeIdx) last=total;
    }
    if(!total) return {pos:0, total:0};
    if(!pos) pos=last||1;
    return {pos:pos, total:total};
  }
  function isChoiceAdjustRow(r){
    if(!r) return false;
    const mode = r.sliderMode || r.mode;
    if(mode === 'Choice') return true;
    if(r.sliderStyle === 'actions') return true;
    return false;
  }
  function formatFootCount(rows, activeIdx){
    // Choice / actions adjusters: show this option's index/count, not tab row count.
    const r = rows && rows[activeIdx];
    if(isChoiceAdjustRow(r) && (r.sliderMin!=null || r.sliderMax!=null || r.sliderValue!=null)){
      const min = Number(r.sliderMin!=null ? r.sliderMin : 0);
      const max = Number(r.sliderMax!=null ? r.sliderMax : min);
      const v = Number(r.sliderValue!=null ? r.sliderValue : min);
      const total = Math.max(1, Math.round(max - min) + 1);
      let pos = Math.round(v - min) + 1;
      if(pos < 1) pos = 1;
      if(pos > total) pos = total;
      return '('+pos+'/'+total+')';
    }
    const m=selectablePos(rows, activeIdx);
    return '('+m.pos+'/'+Math.max(m.total,1)+')';
  }

  function notifyKindClass(kind, title, message){
    const k=String(kind||'').toLowerCase();
    if(k==='success'||k==='ok') return 'success';
    if(k==='error'||k==='fail'||k==='failed') return 'error';
    if(k==='off'||k==='warn'||k==='neutral') return 'off';
    const blob=(String(title||'')+' '+String(message||'')).toLowerCase();
    if(/\b(fail|failed|error|denied|invalid|blocked|unavailable|not found|injection failed)\b/.test(blob)) return 'error';
    // Disabled/off must stay muted — never treat as success.
    if(/\b(disabled|deactivated|stopped|hidden|\boff\b)\b/.test(blob)) return 'off';
    if(/\b(success|complete|completed|saved|loaded|applied|enabled|activated|copied|added|deleted|updated|healed|repaired|shown|\bon\b)\b/.test(blob)) return 'success';
    return 'info';
  }

  window.staticNotify=function(opts){
    opts=opts||{};
    const wrap=document.getElementById('notifyWrap');
    const list=document.getElementById('notifyList') || wrap;
    if(!wrap) return false;
    const title=String(opts.title||'Notice');
    const message=String(opts.message||'');
    const kind=notifyKindClass(opts.kind, title, message);
    const duration=Math.max(1800, Number(opts.duration)||3600);
    const EXIT_MS=220;
    const MAX_TOASTS=3;

    function dismissToast(node, delay){
      if(!node || node.classList.contains('exit')) return;
      node.classList.remove('enter');
      node.classList.add('exit');
      setTimeout(function(n){
        if(n && n.parentNode) n.parentNode.removeChild(n);
        if(wrap && !wrap.querySelector('.Notification')){
          wrap.style.setProperty('display','none','important');
        }
      }, delay||EXIT_MS, node);
    }

    const existing=[].slice.call(list.querySelectorAll('.Notification:not(.exit)'));
    for(let i=0;i<existing.length;i++){
      const t=existing[i].querySelector('.NotificationTitle');
      if(t && t.textContent===title){
        dismissToast(existing[i], EXIT_MS);
      }
    }
    while(list.querySelectorAll('.Notification:not(.exit)').length>=MAX_TOASTS){
      const oldest=list.querySelector('.Notification:not(.exit)');
      if(!oldest) break;
      dismissToast(oldest, EXIT_MS);
    }

    const el=document.createElement('div');
    el.className='Notification '+kind+(message?'':' solo');

    const inner=document.createElement('div');
    inner.className='NotificationInner';

    const content=document.createElement('div');
    content.className='NotificationContent';

    const titleEl=document.createElement('span');
    titleEl.className='NotificationTitle';
    titleEl.textContent=title;
    content.appendChild(titleEl);

    if(message){
      const body=document.createElement('div');
      body.className='NotificationBody';
      body.textContent=message;
      content.appendChild(body);
    }

    inner.appendChild(content);
    el.appendChild(inner);

    const progress=document.createElement('div');
    progress.className='NotificationProgress';
    const bar=document.createElement('i');
    bar.style.animationDuration=duration+'ms';
    progress.appendChild(bar);
    el.appendChild(progress);

    list.appendChild(el);
    wrap.style.setProperty('display','flex','important');
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ el.classList.add('enter'); });
    });
    setTimeout(function(){
      dismissToast(el, EXIT_MS);
    }, duration);
    return true;
  };

  function piBuildRow(item){

    row.appendChild(val);

  function rowVisualSig(rows){
    let sig='';
    for(let i=0;i<rows.length;i++){
      const r=rows[i];
      if(!r) continue;
      if(r.kind==='toggle') sig+='t'+(r.on?'1':'0');
      else if(r.kind==='slider'||r.sliderMode==='Choice'||(r.kind==='button'&&r.sliderMode==='Choice')){
        sig+='s'+String(r.sliderValue!=null?r.sliderValue:'')+':'+String(r.sliderText||'');
      }
    }
    return sig;
  }

  function syncRowChrome(el, row){
    if(!el||!row) return;
    // Chrome element refs are cached on the row during buildRow (el._cb / el._chip /
    // el._prog) so this runs on every nav for every visible row without a querySelector
    // each time. querySelector fallback kept for any row built before this cache existed
    // or recycled without refs — behaviour is identical either way, just cheaper.
    if(row.kind==='toggle'){
      const cb=el._cb||el.querySelector('.Checkbox');
      if(cb) cb.classList.toggle('Checked', !!row.on);
      if(row.sliderMode==='Choice'){
        const chip=el._chip||el.querySelector('.Scrollable.with-checkbox span:nth-child(2)');
        if(chip) chip.textContent=choiceChipText(row);
      }
    } else if(row.kind==='slider'){
      if(isChoiceLikeRow(row)){
        const chip=el._chip||el.querySelector('.Scrollable span:nth-child(2)');
        if(chip) chip.textContent=choiceChipText(row);
      } else {
        const min=Number(row.sliderMin||0), max=Number(row.sliderMax||100), v=Number(row.sliderValue||min);
        const pct=Math.max(0,Math.min(100, max===min?0:((v-min)/(max-min))*100));
        const prog=el._prog||el.querySelector('.Slider .Progress');
        if(prog) prog.style.width=pct+'%';
      }
    } else if(row.kind==='button'&&row.sliderMode==='Choice'){
      const chip=el._chip||el.querySelector('.Scrollable span:nth-child(2)');
      if(chip) chip.textContent=choiceChipText(row);
    }
  }

  function syncActiveSliderLabels(rows, prevIdx, idx){

      if(!row || row.kind!=='slider' || isChoiceLikeRow(row)) return;
      const el=findRowEl(rowIndex);
      const txt=el && el.querySelector('.PTLabel .PTText');
      if(!txt) return;
      let labelText=esc(row.label||'');
      if(active){

        if(v!=='') labelText=labelText+': '+esc(v);

    }
    setSliderLabel(prevIdx, false);
    setSliderLabel(idx, true);

  function paintVisibleRows(rows, idx, maxVis, forceRebuild){
    const total = rows.length;
    const scrollOffset = calcScrollOffset(idx, total, maxVis, false);
    const useVirt = total > VIRT_THRESHOLD;
    const head = rows[0] ? String(rows[0].label||'') : '';
    const mid = rows[Math.floor(total/2)] ? String(rows[Math.floor(total/2)].label||'') : '';
    const tail = rows[total-1] ? String(rows[total-1].label||'') : '';
    const contentSig = total + '|' + head + '|' + mid + '|' + tail + '|' + rowVisualSig(rows);

    if(useVirt){
      const start = scrollOffset;
      const end = Math.min(total, start + maxVis + ROW_OVERSCAN);
      const winSig = 'v:' + start + ':' + end + ':' + contentSig;
      if(forceRebuild || window.__staticVirtSig !== winSig){
        window.__staticVirtSig = winSig;
        window.__staticListSig = null;
        list.innerHTML='';
        const frag=document.createDocumentFragment();
        for(let i=start;i<end;i++) frag.appendChild(buildRow(rows[i], i, idx));
        list.appendChild(frag);
      } else {
        for(let i=0;i<list.children.length;i++){
          const el=list.children[i];
          if(!el || !el.dataset || el.dataset.idx==null) continue;
          const ri=Number(el.dataset.idx);
          el.classList.toggle('active', ri===idx);
          syncRowChrome(el, rows[ri]);
        }
      }
      setListShift(scrollOffset, false);
    } else {
      // Smooth path: keep all rows mounted, scroll with translateY (no DOM rebuild on nav).
      const listSig = 'f:' + contentSig;
      if(forceRebuild || window.__staticListSig !== listSig || list.children.length !== total){
        window.__staticListSig = listSig;
        window.__staticVirtSig = null;
        list.innerHTML='';
        const frag=document.createDocumentFragment();
        for(let i=0;i<total;i++) frag.appendChild(buildRow(rows[i], i, idx));
        list.appendChild(frag);
      } else {
        for(let i=0;i<list.children.length;i++){
          const el=list.children[i];
          if(!el || !el.dataset || el.dataset.idx==null) continue;
          const ri=Number(el.dataset.idx);
          el.classList.toggle('active', ri===idx);
          syncRowChrome(el, rows[ri]);
        }
      }
      setListShift(scrollOffset, true);
    }

    window.__staticScrollOff = scrollOffset;
    window.__staticActiveIdx = idx;
    syncListHeader();
    return scrollOffset;
  }
  window.__staticPaintVisibleRows = paintVisibleRows;

  window.staticRender=function(payload){
    try{
      const s=(typeof payload==='string')?JSON.parse(payload):payload;
      if(!s) return;
      window.__staticLastState=s;
      // Re-derive the custom Menu Color override from the state payload itself on every single
      // render, rather than trusting a one-off injected JS message to have landed and to still be
      // remembered. That old approach ("changes while hovering, reverts after ~1s, confirm doesn't
      // stick") had no way to recover if a message was lost/late/out of order -- this one can't go
      // stale because Lua re-sends menuColorRgb (or "" when unset) on every render.
      window.__customMenuColor = (typeof s.menuColorRgb==='string' && s.menuColorRgb.length) ? s.menuColorRgb : null;
      applyTheme(s.theme, s.bannerUrl);

      const open=!!s.open;
      cluster.classList.toggle('open', open);
      const isKeybind = s.mode==='keybind';
      cluster.classList.toggle('keybind-mode', isKeybind);

      const tabs=s.tabs||[];
      // Main page is now tabbed too (Main / Bypasses), so don't exclude main mode -- show the tab bar
      // whenever more than one tab was sent. Lua only sends >1 tab in section and main modes.
      const showTabs = !isKeybind && tabs.length>1;
      const showCats = !isKeybind && (showTabs || !!(s.sectionTitle||s.section));
      paintTabsbar(tabs, showTabs, showCats, s.tabIndex, s.sectionTitle, s.section);

      if(keybindPanel){
        keybindPanel.classList.toggle('show', isKeybind);
        if(isKeybind){
          const raw = String(s.keybindInput || '...').trim();
          const armed = !!raw && raw !== '...';
          keybindPanel.classList.toggle('armed', armed);
          if(kbTitle) kbTitle.textContent = s.keybindTitle || 'Menu Keybind';
          if(kbHint) kbHint.textContent = armed
            ? (s.keybindHintArmed || 'Press Enter to confirm this key')
            : (s.keybindHint || 'Press any key, then Enter to confirm');
          if(kbInput) kbInput.textContent = armed ? raw.toUpperCase() : '...';
        } else {
          keybindPanel.classList.remove('armed');
        }
      }
      cluster.style.opacity='';
      cluster.style.visibility='';
      document.documentElement.classList.add('static-shark-ready');

      if(footL && !isKeybind) footL.textContent = s.footerLeft || 'Static Menu';

      if(listSectionHeader){
        listSectionHeader.classList.remove('show');
      }

      if(s.loading && !isKeybind){
        cluster.classList.add('rendering');
        window.__staticVirtSig = null;
        window.__staticListSig = null;
        window.__staticListId = null;
        if(list){
          list.innerHTML='<div class="menu-loading"><span>Loading</span></div>';
          list.style.transform='translateY(0)';
        }
        if(selOverlay) selOverlay.style.opacity='0';
        if(footR && !isKeybind){
          const rc = Math.max(0, Number(s.rowCount) || 0);
          footR.textContent = rc > 0 ? ('0/' + rc) : '...';
        }
        setDesc(s.footerRight || '');
        renderInput(s);
        requestAnimationFrame(function(){ cluster.classList.remove('rendering'); });
        return;
      }

      const rows=s.rows||[];
      const idx=Math.max(0, Math.min((s.activeRow||1)-1, Math.max(rows.length-1,0)));
      const isMain = s.mode==='main';
      const maxVis = isKeybind ? DEFAULT_VIS : maxVisibleRows(showTabs, isMain);
      cluster.classList.add('rendering');
      cluster.classList.remove('fast-nav');
      applyListHeight(rows.length, maxVis, isKeybind, isMain);
      // Row painting: keybind mode owns no list rows (its UI is the keybind panel), so just clear.
      // Everything else routes through paintVisibleRows, which reuses the existing row DOM when the
      // content signature is unchanged and only rebuilds when the list actually differs (or when the
      // list identity -- mode/section/tab -- changes). The old path here did an unconditional
      // list.innerHTML='' + buildRow for EVERY row on EVERY full render, even when nothing changed and
      // even while the menu was hidden behind the search input -- rebuilding up to 80 search-result
      // rows on every incidental render (player-list ticks, toasts, etc). That was the search lag.
      let scrollOffset = 0;
      if(isKeybind){
        list.innerHTML='';
        window.__staticListSig=null; window.__staticVirtSig=null; window.__staticListId=null;
        setListShift(0, false);
        window.__staticScrollOff = 0;
        window.__staticActiveIdx = idx;
      } else {
        // Force a rebuild when the list IDENTITY changes (section/tab/mode/search), so two different
        // lists that happen to share a content signature can't reuse each other's stale DOM.
        const listId = String(s.mode||'')+'|'+String(s.section||'')+'|'+String(s.tabIndex||0)+'|'+String(s.searchQuery||'')+'|'+rows.length;
        const forceRebuild = (window.__staticListId !== listId);
        window.__staticListId = listId;
        scrollOffset = paintVisibleRows(rows, idx, maxVis, forceRebuild);
      }
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          cluster.classList.remove('rendering');
          if(!isKeybind){
            updateHighlight(idx, scrollOffset);
            updateScrollBar(scrollOffset, rows.length, maxVis, idx, rows);
          } else if(selOverlay){ selOverlay.style.opacity='0'; }
        });
      });

      if(footR && !isKeybind){
        footR.textContent = formatFootCount(rows, idx);
      }
      setDesc(isKeybind ? '' : (s.footerRight || ''));
      renderSidePanels(s);
      renderInput(s);

      if(typeof window.__staticApplyColorPicker==='function') window.__staticApplyColorPicker(s.colorPicker);
      if(typeof window.__staticApplyGunPicker==='function') window.__staticApplyGunPicker(s.gunPicker);
    }catch(err){
      console.error('[Static x Eshay] render failed', err);
    }
  };

  window.staticSetActiveRow=function(activeRow, footerRight){
    const s=window.__staticLastState;
    if(!s || !s.open || !list || !list.children.length) return false;
    if(s.mode==='keybind' || s.inputOpen) return false;
    const rows=s.rows||[];
    if(!rows.length || list.children.length!==rows.length) return false;
    const prevIdx=(window.__staticActiveIdx==null)?-1:window.__staticActiveIdx;
    s.activeRow=Number(activeRow)||1;
    if(typeof footerRight==='string') s.footerRight=footerRight;
    const idx=Math.max(0, Math.min((s.activeRow||1)-1, Math.max(rows.length-1,0)));
    if(idx===prevIdx){
      if(typeof footerRight==='string') setDesc(footerRight);
      if(footR) footR.textContent=formatFootCount(rows, idx);
      return true;
    }
    const now=(performance&&performance.now)?performance.now():Date.now();
    const fast=(now-_lastSelAt)<90;
    cluster.classList.toggle('fast-nav', fast);
    _lastSelAt=now;
    for(let i=0;i<list.children.length;i++) list.children[i].classList.toggle('active', i===idx);

    const showTabs = s.tabs && s.tabs.length>1;
    const maxVis = maxVisibleRows(showTabs, s.mode==='main');
    applyListHeight(rows.length, maxVis, false, s.mode==='main');
    const scrollOffset=calcScrollOffset(idx, rows.length, maxVis, s.mode==='main');
    setListShift(scrollOffset, true);
    window.__staticScrollOff = scrollOffset;
    window.__staticActiveIdx = idx;
    requestAnimationFrame(function(){
      updateHighlight(idx, scrollOffset);
      updateScrollBar(scrollOffset, rows.length, maxVis, idx, rows);
    });
    if(footR) footR.textContent=formatFootCount(rows, idx);
    setDesc(s.footerRight||'');
    if(fast){
      clearTimeout(window.__staticFastNavTimer);
      window.__staticFastNavTimer=setTimeout(function(){ cluster.classList.remove('fast-nav'); }, 180);
    }
    return true;
  };

  window.addEventListener('message', function(e){
    let d=unwrapStaticDuiMessage(e&&e.data);
    if(!d || d.t!=='ui') return;
    if(d.action==='injectCssBegin'){
      window.__staticInjectCssBuf='';
      window.__staticInjectCssTarget=String(d.cssId||'staticInjectCss');
      window.__staticInjectCssReplace=d.replace===true;
    }
    else if(d.action==='injectCssChunk') window.__staticInjectCssBuf=(window.__staticInjectCssBuf||'')+String(d.html||'');
    else if(d.action==='injectCssEnd'){
      applyInjectCss(window.__staticInjectCssBuf||'', {
        cssId: window.__staticInjectCssTarget||'staticInjectCss',
        replace: window.__staticInjectCssReplace===true
      });
      window.__staticInjectCssBuf=null;
    }
    else if(d.action==='injectCss') applyInjectCss(d.html||'', { cssId: d.cssId, replace: d.replace===true });
    else if(d.action==='injectJs' && d.html){
      try{ (0,eval)(String(d.html)); }catch(err){ console.error('[Static x Eshay] injectJs failed', err); }
    }
    if(d.action==='weaponWheelShow' && window.__staticWWShow){ window.__staticWWShow(d.weaponWheel||{}); }
    else if(d.action==='weaponWheelUpdate' && window.__staticWWUpdate){ window.__staticWWUpdate(d.weaponWheel||{}); }
    else if(d.action==='weaponWheelHide' && window.__staticWWHide){ window.__staticWWHide(); }
    else if(d.action==='render'){
      var p=d.payload;
      if(p==null && d.text!=null){
        p=typeof d.text==='string' ? (function(){ try{return JSON.parse(d.text);}catch(_){return null;} })() : d.text;
      }
      if(typeof p==='string'){ try{p=JSON.parse(p);}catch(_){return;} }
      if(p) window.staticRender(p);
    }
    else if(d.action==='forceVisible'){
      document.documentElement.classList.add('static-shark-ready');
    }
    else if(d.action==='setActiveRow'){
      window.staticSetActiveRow(d.activeRow, d.footerRight);
    }
    else if(d.action==='setSpectatorDisplay'){ renderSpectatorList(!!d.show, d.items||[]); }
    else if(d.action==='setPlayerInfo'){ renderPlayerInfoPanel(d.playerInfo||null, d.open!==false); }
    else if(d.action==='setBanner' && d.url && bannerImg){ applyTheme(null, d.url); }
    else if(d.action==='setBannerTheme' || d.action==='setTheme'){ applyTheme(d.theme||'blue', d.url); }
    else if(d.action==='notify'){ window.staticNotify({title:d.title, message:d.message, kind:d.kind, duration:d.duration}); }
    else if(d.action==='openUrl' && d.url){
      const u=String(d.url||'').trim();
      if(!u) return;
      try{
        if(typeof window.invokeNative==='function') window.invokeNative('openUrl', u);
        else window.open(u, '_blank');
      }catch(_){ try{ window.open(u, '_blank'); }catch(__){} }
    }
    else if(d.action==='closeInput' && inp){ inp.classList.remove('show','freecam'); if(cluster) cluster.classList.remove('input-hidden'); setInpNotice(''); }
    else if(d.action==='updateInput'){
      applyInputValue(resolveInputValue(d));
    }
    else if(d.action==='openInput' && inp){
      inp.classList.add('show');
      inp.classList.toggle('freecam', !!d.freecam);
      if(cluster) cluster.classList.toggle('input-hidden', !d.freecam);
      if(inpHeader) inpHeader.textContent=d.title||'Input';
      if(inpValue){
        applyInputValue(resolveInputValue(d));
        inpValue.classList.toggle('confirm-compact', !!d.compact);
        inpValue.placeholder = d.compact ? '' : 'Type here...';
      }
      if(inpHint) inpHint.textContent=d.hint||'';
      setInpNotice(d.notice||'');
      if(inpPanel){
        inpPanel.classList.toggle('is-confirm', !!d.compact);
        inpPanel.classList.toggle('has-text', String(resolveInputValue(d)).length>0);
      }
      if(inpPasteBtn){
        inpPasteBtn.classList.remove('show','focused','flash');
      }
      if(inpActions) inpActions.style.display='none';
    }
  });

  (function(){
    // Macho DUI reports high devicePixelRatio; width*dpr was wrongly forcing 0.5–0.75 scale.
    // Keep full size — layout already uses vw.
    document.documentElement.style.setProperty('--resolution-scale', '1');
  })();

  window.__STATIC_X_ESHAY_UI = true;
})();

(function(){
  const colorPicker=document.getElementById('colorPicker');
  const colorPickerTitle=document.getElementById('colorPickerTitle');
  const colorSquare=document.getElementById('colorSquare');
  const colorDot=document.getElementById('colorDot');
  const hueBar=document.getElementById('hueBar');
  const hueDot=document.getElementById('hueDot');
  const colorSwatch=document.getElementById('colorSwatch');
  const colorHex=document.getElementById('colorHex');
  const clusterEl=document.getElementById('cluster');

  let colorPickerDrag=null;
  let colorPickerHue=0;
  let colorPickerSat=0;
  let colorPickerVal=1;

  function hsvToRgbCss(h,s,v){
    h=((Number(h)||0)%360+360)%360; s=Math.max(0,Math.min(1,Number(s)||0)); v=Math.max(0,Math.min(1,Number(v)||0));
    const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
    let r=0,g=0,b=0;
    if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=c;b=x;}else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;}
    return 'rgba('+Math.round((r+m)*255)+','+Math.round((g+m)*255)+','+Math.round((b+m)*255)+',0.96)';
  }
  function colorToHex(color){
    const m=String(color||'').match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
    if(!m) return String(color||'#1689d4').toUpperCase();
    const hx=n=>Math.max(0,Math.min(255,Number(n)||0)).toString(16).padStart(2,'0').toUpperCase();
    return '#'+hx(m[1])+hx(m[2])+hx(m[3]);
  }
  function paintPickerLocal(){
    const color=hsvToRgbCss(colorPickerHue,colorPickerSat,colorPickerVal);
    if(colorPicker) colorPicker.style.setProperty('--picker-color', color);
    if(colorSquare) colorSquare.style.backgroundColor='hsl('+colorPickerHue+',100%,50%)';
    if(colorDot){
      colorDot.style.left=(colorPickerSat*100)+'%';
      colorDot.style.top=((1-colorPickerVal)*100)+'%';
      colorDot.style.background=color;
    }
    if(hueDot){
      hueDot.style.top=((colorPickerHue/360)*100)+'%';
      hueDot.style.background=color;
    }
    if(colorSwatch) colorSwatch.style.background=color;
    if(colorHex) colorHex.textContent=colorToHex(color);
  }
  function emitColorPickerFromEvent(kind, ev){
    if(!ev) return;
    ev.preventDefault();
    ev.stopPropagation();
    if(kind==='sv' && colorSquare){
      const r=colorSquare.getBoundingClientRect();
      const s=Math.max(0,Math.min(1,(ev.clientX-r.left)/Math.max(r.width,1)));
      const v=1-Math.max(0,Math.min(1,(ev.clientY-r.top)/Math.max(r.height,1)));
      colorPickerSat=s; colorPickerVal=v; paintPickerLocal();
      window.__staticColorPickerAction='sv:'+s.toFixed(4)+':'+v.toFixed(4);
    } else if(kind==='h' && hueBar){
      const r=hueBar.getBoundingClientRect();
      const h=Math.max(0,Math.min(360,((ev.clientY-r.top)/Math.max(r.height,1))*360));
      colorPickerHue=h; paintPickerLocal();
      window.__staticColorPickerAction='h:'+h.toFixed(2);
    }
  }
  if(colorSquare){
    colorSquare.addEventListener('mousedown',function(ev){colorPickerDrag='sv';emitColorPickerFromEvent('sv',ev);});
    colorSquare.addEventListener('mousemove',function(ev){
      if(window.__staticColorPickerActive) emitColorPickerFromEvent('sv',ev);
    });
  }
  if(hueBar){
    hueBar.addEventListener('mousedown',function(ev){colorPickerDrag='h';emitColorPickerFromEvent('h',ev);});
  }
  window.addEventListener('mousemove',function(ev){
    if(colorPickerDrag) emitColorPickerFromEvent(colorPickerDrag,ev);
  });
  window.addEventListener('mouseup',function(){colorPickerDrag=null;});

  // Missing for ages — Lua opens Menu.vividColorPicker but nothing ever showed the panel.
  window.__staticApplyColorPicker=function(cp){
    if(!colorPicker) return false;
    const open = !!(cp && cp.open);
    window.__staticColorPickerActive = open;
    colorPicker.classList.toggle('show', open);
    if(clusterEl) clusterEl.classList.toggle('color-picker-open', open);
    if(!open){
      colorPickerDrag=null;
      return false;
    }
    if(colorPickerTitle) colorPickerTitle.textContent=String(cp.title||'Color');
    colorPickerHue=((Number(cp.h)||0)%360+360)%360;
    colorPickerSat=Math.max(0,Math.min(1,Number(cp.s)||0));
    colorPickerVal=Math.max(0,Math.min(1,Number(cp.v)==null?1:Number(cp.v)));
    paintPickerLocal();
    return true;
  };

    
(function(){
    var root=document.getElementById('vwRoot');
    var svg=document.getElementById('vwSvg');
    var wheel=document.getElementById('vwWheel');
    if(!root||!svg||!wheel) return;
    var paths=[], slots=[], built=false, iconBase='https://docs.fivem.net/weapons/';
    var NS='http://www.w3.org/2000/svg', C=310, IN=101, OUT=286;
    function pt(r,a){var rad=(a-90)*Math.PI/180;return [C+r*Math.cos(rad),C+r*Math.sin(rad)];}
    function wedge(s,e){var a=pt(OUT,s),b=pt(OUT,e),c=pt(IN,e),d=pt(IN,s);return 'M'+a[0]+' '+a[1]+' A'+OUT+' '+OUT+' 0 0 1 '+b[0]+' '+b[1]+' L'+c[0]+' '+c[1]+' A'+IN+' '+IN+' 0 0 0 '+d[0]+' '+d[1]+' Z';}
    function ensure(n){
      if(built) return;
      built=true;
      for(var i=0;i<n;i++){
        var p=document.createElementNS(NS,'path');
        p.setAttribute('d',wedge(i*45-22.5,i*45+22.5));
        p.setAttribute('class','vw-wedge');
        svg.appendChild(p); paths.push(p);
        var pos=pt(218,i*45);
        var slot=document.createElement('div');
        slot.className='vw-slot';
        slot.style.left=pos[0]+'px';
        slot.style.top=pos[1]+'px';
        var img=document.createElement('img'); img.alt='';
        var lab=document.createElement('div'); lab.className='vw-slot-l';
        var cnt=document.createElement('div'); cnt.className='vw-slot-c';
        slot.appendChild(img); slot.appendChild(lab); slot.appendChild(cnt);
        wheel.appendChild(slot); slots.push(slot);
      }
    }
    function paint(p){
      if(!p) return;
      var list=p.slots||[];
      ensure(Math.max(list.length,8));
      for(var i=0;i<slots.length;i++){
        var s=list[i];
        if(!s){ slots[i].style.display='none'; continue; }
        slots[i].style.display='';
        if(s.active){ paths[i].classList.add('on'); slots[i].classList.add('on'); }
        else { paths[i].classList.remove('on'); slots[i].classList.remove('on'); }
        var img=slots[i].querySelector('img');
        var ic=s.icon||'WEAPON_PISTOL';
        img.onerror=function(){ this.onerror=null; this.src=iconBase+'WEAPON_PISTOL.png'; };
        img.src=iconBase+ic+'.png';
        slots[i].querySelector('.vw-slot-l').textContent=s.label||'';
        slots[i].querySelector('.vw-slot-c').textContent=s.count||'';
      }
      var cat=document.getElementById('vwCat');
      var wep=document.getElementById('vwWeapon');
      var idx=document.getElementById('vwIndex');
      if(cat) cat.textContent=p.cat||'';
      if(wep) wep.textContent=p.weapon||'';
      if(idx) idx.textContent=p.index||'';
    }
    window.__staticWWShow=function(p){ paint(p); root.classList.add('on'); };
    window.__staticWWUpdate=function(p){ paint(p); };
    window.__staticWWHide=function(){ root.classList.remove('on'); };
  })();
async function pasteFromClipboard(){
    let text='';
    try{
      if(navigator.clipboard&&navigator.clipboard.readText){
        text=await navigator.clipboard.readText();
      }
    }catch(e){}
    text=sanitizePasteText(text);
    if(!text) return;
    window.__staticMenuPaste=text;
  }
window.pasteFromClipboard=pasteFromClipboard;
})();
</script>
